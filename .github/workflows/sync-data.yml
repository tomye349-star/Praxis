name: Sync dashboard data

# Runs on a schedule, pulls fresh data from Canvas and the SBHS Student
# Portal, and pushes it into the private Cloudflare Worker backend (never
# into this repo — that keeps your real timetable/assignments out of a
# public GitHub Pages site). Strava/Garmin/Huawei sync will be added the
# same way in a later update.

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch: {}     # lets you trigger a run manually from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Sync Canvas assignments
        run: python3 scripts/fetch_canvas.py
        env:
          CANVAS_DOMAIN: ${{ secrets.CANVAS_DOMAIN }}
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          DASH_API_URL: ${{ secrets.DASH_API_URL }}
          DASH_TOKEN: ${{ secrets.DASH_TOKEN }}

      - name: Sync SBHS timetable
        run: python3 scripts/fetch_sbhs.py
        env:
          SBHS_CLIENT_ID: ${{ secrets.SBHS_CLIENT_ID }}
          SBHS_CLIENT_SECRET: ${{ secrets.SBHS_CLIENT_SECRET }}
          DASH_API_URL: ${{ secrets.DASH_API_URL }}
          DASH_TOKEN: ${{ secrets.DASH_TOKEN }}

      # Next batch: Strava / Garmin / Huawei Health sync steps go here,
      # each with its own secrets, each writing into the same private
      # backend via its own kv_store key (e.g. "activities").
