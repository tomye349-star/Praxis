name: Sync dashboard data

# This workflow is a placeholder scaffold. Once each data source is wired up
# (Canvas, SBHS Student Portal, Strava, Garmin, Huawei Health), the "Fetch data"
# step below will call real scripts in /scripts that read API tokens from
# repo secrets (Settings -> Secrets and variables -> Actions) and write the
# results into /data/*.json, which this workflow then commits back.

on:
  schedule:
    - cron: "0 */1 * * *"   # every hour — tune once real API calls exist
  workflow_dispatch: {}       # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # - name: Install dependencies
      #   run: pip install -r scripts/requirements.txt

      - name: Fetch data (placeholder — no-op until scripts exist)
        run: |
          echo "TODO: call scripts/fetch_canvas.py, fetch_sbhs.py, fetch_strava.py, fetch_garmin.py, fetch_huawei.py"
          echo "Each script should write its output into /data/*.json"
        env:
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          SBHS_TOKEN: ${{ secrets.SBHS_TOKEN }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          HUAWEI_TOKEN: ${{ secrets.HUAWEI_TOKEN }}

      - name: Commit updated data
        run: |
          git config user.name "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Update dashboard data"
          git push
