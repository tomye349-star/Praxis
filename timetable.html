<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Timetable</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="page">

  <nav class="tabnav">
    <a href="index.html">Overview</a>
    <a href="timetable.html">Timetable</a>
    <a href="study.html">Study</a>
    <a href="training.html">Training</a>
    <a href="upcoming.html">Upcoming</a>
  </nav>

  <div class="page-header">
    <h1>🗓 Timetable</h1>
    <a class="back" href="index.html">← Back to overview</a>
  </div>

  <div id="connectNotice"></div>

  <div class="grid single">
    <div class="card timetable">
      <div class="section-block">
        <h3>Today</h3>
        <div id="todayList"><div class="empty-state">Loading…</div></div>
      </div>
    </div>
  </div>

  <div class="grid single">
    <div class="card timetable">
      <div class="section-block">
        <h3>This week / cycle</h3>
        <div class="timetable-table-wrap" id="weekTable"><div class="empty-state">Loading…</div></div>
      </div>
    </div>
  </div>

  <div class="grid single">
    <div class="card timetable">
      <div class="section-block">
        <h3>Look ahead</h3>
        <div id="lookAheadList"><div class="empty-state">Loading…</div></div>
      </div>
    </div>
  </div>

</div>

<script src="assets/app.js"></script>
<script>
  // Today: one enriched row per period — time, subject (struck through +
  // "Free" badge if the school cancelled it), teacher, room, and a
  // substitution note if a casual teacher is covering.
  function renderToday(periods, hint) {
    const el = document.getElementById('todayList');
    if (!periods || !periods.length) {
      el.innerHTML = '<div class="empty-state">Nothing here yet' + (hint ? ' — ' + hint : '') + '.</div>';
      return;
    }
    el.innerHTML = periods.map(function (p) {
      const subjClass = p.cancelled ? 'period-subject cancelled-subject' : 'period-subject';
      const freeBadge = p.cancelled ? '<span class="badge free">Free</span>' : '';
      const metaBits = [p.teacher, p.location].filter(Boolean).map(escapeHtml).join(' · ');
      const noteBit = (p.note && !p.cancelled) ? (metaBits ? ' · ' : '') + escapeHtml(p.note) : '';
      return '<div class="period-entry">' +
        '<div class="period-entry-top">' +
        '<span class="period-time">' + escapeHtml(p.time || '') + '</span>' +
        '<span class="' + subjClass + '">' + escapeHtml(p.subject) + '</span>' +
        freeBadge +
        '</div>' +
        (metaBits || noteBit ? '<div class="period-entry-meta">' + metaBits + noteBit + '</div>' : '') +
        '</div>';
    }).join('');
  }

  // This week / cycle: Week A / Week B blocks, each a 5-day column grid of
  // colour-coded class chips — styled after HighHelp's cycle view. Falls
  // back gracefully to "day" as the label if weekday/cycle aren't present
  // (older cached data, or an unexpected shape).
  const WEEKDAY_ORDER = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];

  function renderWeekTable(week, hint) {
    const el = document.getElementById('weekTable');
    if (!week || !week.length) {
      el.innerHTML = '<div class="empty-state">Nothing here yet' + (hint ? ' — ' + hint : '') + '.</div>';
      return;
    }

    const byCycle = {};
    week.forEach(function (d) {
      const cycle = d.cycle || 'A';
      const weekday = d.weekday || d.day || '';
      (byCycle[cycle] = byCycle[cycle] || {})[weekday] = d;
    });
    const cycles = Object.keys(byCycle).sort();
    if (!cycles.length) {
      el.innerHTML = '<div class="empty-state">Nothing here yet' + (hint ? ' — ' + hint : '') + '.</div>';
      return;
    }

    el.innerHTML = cycles.map(function (cycle) {
      const days = byCycle[cycle];
      const dayKeys = Object.keys(days).sort(function (a, b) {
        const ia = WEEKDAY_ORDER.indexOf(a), ib = WEEKDAY_ORDER.indexOf(b);
        return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
      });
      const cols = dayKeys.map(function (wd) {
        const items = (days[wd].items || []).map(function (item) {
          const accent = item.colour ? 'style="--chip-accent:#' + item.colour.replace(/[^0-9a-fA-F]/g, '') + '"' : '';
          const subjClass = item.cancelled ? 'cs cancelled-subject' : 'cs';
          return '<div class="class-chip' + (item.cancelled ? ' cancelled' : '') + '" ' + accent + '>' +
            '<div class="' + subjClass + '">' + escapeHtml(item.subject) + (item.cancelled ? ' <span class="badge free">Free</span>' : '') + '</div>' +
            '<div class="cr">' + escapeHtml(item.location || '') + '</div>' +
            '</div>';
        }).join('');
        return '<div><div class="cycle-day-col-header">' + escapeHtml(wd) + '</div>' +
          '<div class="cycle-day-col">' + (items || '<div class="empty-state" style="padding:4px 0;">—</div>') + '</div></div>';
      }).join('');
      return '<div class="cycle-week-block"><div class="cycle-week-title">Week ' + escapeHtml(cycle) + '</div>' +
        '<div class="cycle-grid">' + cols + '</div></div>';
    }).join('');
  }

  function renderGroup(elId, periods, opts) {
    opts = opts || {};
    const el = document.getElementById(elId);
    if (!periods || !periods.length) {
      el.innerHTML = '<div class="empty-state">Nothing here yet' + (opts.hint ? ' — ' + opts.hint : '') + '.</div>';
      return;
    }
    el.innerHTML = periods.map(function (p) {
      return '<div class="row"><span>' + escapeHtml(p.time || '') + ' — ' + escapeHtml(p.subject) + '</span>' +
        '<span class="meta">' + escapeHtml(p.location || '') + '</span></div>';
    }).join('');
  }

  async function loadState() {
    if (!requireConnectionOrNotice('connectNotice')) {
      renderToday(null, 'connect your backend first');
      renderWeekTable(null, 'connect your backend first');
      renderGroup('lookAheadList', null, { hint: 'connect your backend first' });
      return;
    }
    try {
      const state = await apiFetch('/api/state');
      const timetable = state.timetable;
      if (!timetable) {
        renderToday(null, 'no sync has run yet, check back after the next hourly sync');
        renderWeekTable(null, 'no sync has run yet');
        renderGroup('lookAheadList', null, { hint: 'no sync has run yet' });
        return;
      }
      renderToday(timetable.today, 'nothing scheduled today');
      renderWeekTable(timetable.week, 'nothing scheduled this cycle yet — this fills in once look-ahead data syncs');
      renderGroup('lookAheadList', timetable.lookAhead, { hint: 'look-ahead data isn\'t populated yet' });
    } catch (err) {
      document.getElementById('connectNotice').innerHTML =
        '<div class="notice">Couldn\'t reach your backend (' + err.message + ') — <a href="index.html">check connection</a>.</div>';
    }
  }

  window.addEventListener('DOMContentLoaded', loadState);
</script>

</body>
</html>
