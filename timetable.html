<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Timetable</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="page">

  <nav class="tabnav">
    <a href="index.html">Overview</a>
    <a href="timetable.html">Timetable</a>
    <a href="study.html">Study</a>
    <a href="training.html">Training</a>
    <a href="upcoming.html">Upcoming</a>
  </nav>

  <div class="page-header">
    <h1>🗓 Timetable</h1>
    <a class="back" href="index.html">← Back to overview</a>
  </div>

  <div id="connectNotice"></div>

  <div class="grid single">
    <div class="card timetable">
      <div class="section-block">
        <h3>Today</h3>
        <div id="todayList"><div class="empty-state">Loading…</div></div>
      </div>
      <div class="section-block">
        <h3>This week / cycle</h3>
        <div id="weekList"><div class="empty-state">Loading…</div></div>
      </div>
      <div class="section-block">
        <h3>Look ahead</h3>
        <div id="lookAheadList"><div class="empty-state">Loading…</div></div>
      </div>
    </div>
  </div>

</div>

<script src="assets/app.js"></script>
<script>
  function renderGroup(elId, periods, opts) {
    opts = opts || {};
    const el = document.getElementById(elId);
    if (!periods || !periods.length) {
      el.innerHTML = '<div class="empty-state">Nothing here yet' + (opts.hint ? ' — ' + opts.hint : '') + '.</div>';
      return;
    }
    el.innerHTML = periods.map(function (p) {
      const label = (opts.showDay && p.day) ? (escapeHtml(p.day) + ', ' + escapeHtml(p.time)) : escapeHtml(p.time);
      return '<div class="row"><span>' + label + ' — ' + escapeHtml(p.subject) + '</span>' +
        '<span class="meta">' + escapeHtml(p.location || '') + '</span></div>';
    }).join('');
  }

  async function loadState() {
    if (!requireConnectionOrNotice('connectNotice')) {
      renderGroup('todayList', null, { hint: 'connect your backend first' });
      renderGroup('weekList', null, { hint: 'connect your backend first' });
      renderGroup('lookAheadList', null, { hint: 'connect your backend first' });
      return;
    }
    try {
      const state = await apiFetch('/api/state');
      const timetable = state.timetable;
      if (!timetable) {
        renderGroup('todayList', null, { hint: 'no sync has run yet, check back after the next hourly sync' });
        renderGroup('weekList', null, { hint: 'no sync has run yet' });
        renderGroup('lookAheadList', null, { hint: 'no sync has run yet' });
        return;
      }
      renderGroup('todayList', timetable.today, { hint: 'nothing scheduled today' });

      const weekFlat = [];
      (timetable.week || []).forEach(function (d) {
        (d.items || []).forEach(function (p) { weekFlat.push(Object.assign({ day: d.day }, p)); });
      });
      renderGroup('weekList', weekFlat, { showDay: true, hint: 'nothing scheduled this cycle' });

      renderGroup('lookAheadList', timetable.lookAhead, { hint: 'look-ahead data isn\'t populated yet' });
    } catch (err) {
      document.getElementById('connectNotice').innerHTML =
        '<div class="notice">Couldn\'t reach your backend (' + err.message + ') — <a href="index.html">check connection</a>.</div>';
    }
  }

  window.addEventListener('DOMContentLoaded', loadState);
</script>

</body>
</html>
